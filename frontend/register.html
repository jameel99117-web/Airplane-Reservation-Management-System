<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | SkyBook Airlines</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-hero">
      <div class="overlay"></div>
      <div class="auth-hero-content fade-in">
        <h1>Join SkyBook Airlines</h1>
        <p>Experience luxury travel with seamless booking and global destinations.</p>
      </div>
    </div>
    <div class="auth-panel">
      <div class="auth-card fade-in-up">
        <h1>Passenger Registration</h1>
        <p class="muted">Create your account to start booking flights</p>
        <div id="alert" class="alert hidden"></div>
        <form id="reg-form">
          <div class="form-group">
            <label for="name">Name</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">👤</span>
              <input type="text" id="name" class="input-field" required>
            </div>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">✉</span>
              <input type="email" id="email" class="input-field" required>
            </div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">🔒</span>
              <input type="password" id="password" class="input-field" minlength="6" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>
        <p class="switch-link">Already have an account? <a href="login.html">Login</a></p>
      </div>
    </div>
  </div>
  <script src="js/core/roles-config.js"></script>
  <script src="js/core/api-client.js"></script>
  <script src="js/core/session.js"></script>
  <script src="js/core/icons.js"></script>
  <script src="js/core/visuals.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/pages/register.js"></script>
</body>
</html>
