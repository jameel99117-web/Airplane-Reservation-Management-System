<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Flights | SkyBook Airlines</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-flights">
  <header class="navbar"></header>

  <section class="page-banner reveal" data-banner-auto>
    <div class="page-banner-overlay" aria-hidden="true"></div>
    <div class="container">
      <div class="page-header mb-0">
        <h1>Search Flights</h1>
        <p>Find the perfect route for your next adventure</p>
      </div>
    </div>
  </section>

  <main class="container fade-in">
    <div id="alert" class="alert hidden"></div>
    <div class="card reveal">
      <form id="search-form" class="search-bar">
        <div class="form-group">
          <label for="source">From</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true"></span>
            <input id="source" placeholder="New York" class="input-field">
          </div>
        </div>
        <div class="form-group">
          <label for="destination">To</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true"></span>
            <input id="destination" placeholder="Los Angeles" class="input-field">
          </div>
        </div>
        <div class="form-group">
          <label for="date">Date</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true"></span>
            <input type="date" id="date" class="input-field">
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
        <button type="button" id="btn-clear" class="btn btn-ghost">Show All</button>
      </form>
      <div class="quick-filters">
        <button class="btn btn-sm btn-outline quick-search" data-source="New York" data-dest="Los Angeles">NY → LA</button>
        <button class="btn btn-sm btn-outline quick-search" data-source="Chicago" data-dest="Miami">CHI → MIA</button>
        <button class="btn btn-sm btn-ghost" id="btn-show-all">All Flights</button>
      </div>
    </div>
    <p id="search-results" class="results-count hidden"></p>
    <div id="flights-loading" class="card reveal"></div>
    <div id="flights-list" class="grid grid-2"></div>
    <div id="flights-empty" class="hidden"></div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/core/roles-config.js"></script>
  <script src="js/core/api-client.js"></script>
  <script src="js/core/session.js"></script>
  <script src="js/core/icons.js"></script>
  <script src="js/core/visuals.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/pages/flights.js"></script>
</body>
</html>
